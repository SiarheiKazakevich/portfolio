<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./styles/style.css" rel="stylesheet" type="text/css">
  <link href="./styles/style768.css" rel="stylesheet" href="text/css">
  <link href="./styles/style380.css" rel="stylesheet" href="text/css">
  <link rel="icon" type="image/png" href="./assets/icon.svg">
  <title>Portfolio</title>
</head>

<body>
  <div class="mainwraper">
    <header class="header">
      <div class="logobox">
        <div class="logo"></div>
        <span class="textlogo"></span>
      </div>
      <nav class="navbox">
        <ul class="nav-list">
          <li><a href="#about">about me</a></li>
          <li><a href="#portfolio">portfolio</a></li>
          <li><a href="#price">price</a></li>
          <li><a href="#faq">faq</a></li>
          <li><a href="#contacts">contacts</a></li>
        </ul>
      </nav>
      <label class="burgermenu" for="burger-toggle">
        <input type="checkbox" id="burger-toggle" />
        <span class="linesizeburgermenu1"></span>
        <span class="linesizeburgermenu2"></span>
      </label>
    </header>
    <section class="hero">
      <div class="leftherosection">
        <p class="heroleftboxlongtext">Best Photographer by MAX</p>
        <div class="heroleftboxline"></div>
        <p class="heroleftboxsmalltext">2025</p>
      </div>
      <div class="rightherosection">
        <div class="herorightbox1l">
          <div class="bigestboxofrightbox1l">
            <div class="bigcounterbox">
              <div class="leftcounterbox">
                <div class="plusbox leftplusbox">+</div>
                <div class="lefttotalnumersbox">
                  <div class="numerboxoflefttotalnumersbox">487</div>
                  <div class="textboxoflefttotalnumersbox">Photo sessions</div>
                </div>
              </div>
              <div class="rightcounterbox">
                <div class="plusbox rightplusbox">+</div>
                <div class="righttotalnumersbox">
                  <div class="numerboxofrighttotalnumersbox">356</div>
                  <div class="textboxofrighttotalnumersbox">Satisfied clients</div>
                </div>
              </div>
            </div>
            <p class="bigtitlebox">Professional photographer</p>
            <p class="smalltextbox">Capture the Moment. Tell Your Story.</p>
          </div>
          <div class="smallestboxofrightbox1l">
            <div class="textboxofsmallestbox">Scroll down</div>
            <div class="arrowdown"></div>
          </div>
        </div>
        <div class="herorightbox2c">
          <div class="imgboxofherorightbox2c"></div>
        </div>
        <div class="herorightbox3r">
          <div class="imgboxofherorightbox3r"></div>
          <p class="textboxofherorightbox3r">
            Hi! I’m Vera, a photographer. For me,
            photography is more than just an image.
          </p>
        </div>
      </div>
    </section>




    
    <section class="about"></section>
    <section class="portfolio"></section>
    <section class="price"></section>
    <section class="faq"></section>
    <footer class="footer"></footer>
  </div>
  <script src="./scripts/script.js"></script>
</body>

</html>
